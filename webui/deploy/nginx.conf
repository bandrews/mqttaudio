# Reverse-proxy sidecar for the mqttaudio web app (DW1) — nginx alternative.
#
# Same topology as the Caddyfile: serve the built SPA, proxy /api/* (prefix
# stripped) and /ws to the daemon, inject the Bearer header server-side (DW9).
# Replace <DAEMON_TOKEN> with the daemon's http.auth_token (or drop the
# Authorization lines if the daemon is open). For TLS/wss, wrap this in a
# `listen 443 ssl;` server with certificates and the same locations.

upstream mqttaudio_daemon {
    server 127.0.0.1:8080;
}

server {
    listen 8088;
    server_name _;

    root /srv/webui;   # the built SPA (webui/dist)
    index index.html;

    # REST API: strip /api and inject the Bearer header.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://mqttaudio_daemon;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Bearer <DAEMON_TOKEN>";
    }

    # WebSocket stream (/ws).
    location /ws {
        proxy_pass http://mqttaudio_daemon;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Authorization "Bearer <DAEMON_TOKEN>";
        proxy_read_timeout 1h;
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
