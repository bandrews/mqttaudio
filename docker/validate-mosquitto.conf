# Validation broker: anonymous access on plain 1883 and TLS 8883.
# Used only inside the validation container, never for deployment.
# The TLS cert/key are generated at run time by gen-test-certs.sh.
per_listener_settings false
allow_anonymous true

listener 1883

listener 8883
cafile /etc/mosquitto/tls/ca.crt
certfile /etc/mosquitto/tls/server.crt
keyfile /etc/mosquitto/tls/server.key
